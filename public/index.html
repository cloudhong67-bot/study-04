<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>냉장고를 부탁해</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🧊 냉장고를 부탁해</h1>
    <p class="subtitle">냉장고 사진을 올리면 어떤 재료가 있는지 찾아드려요.</p>
  </header>

  <main>
    <section class="card" id="upload-section">
      <h2>1. 냉장고 사진 올리기</h2>
      <label class="file-picker">
        <input type="file" id="file-input" accept="image/*" capture="environment">
        <span>📷 사진 선택 / 촬영</span>
      </label>
      <p class="hint">JPEG, PNG, WebP · 최대 10MB</p>
      <img id="preview" alt="선택한 냉장고 사진 미리보기" hidden>
      <button id="recognize-btn" class="primary" disabled>재료 인식</button>
      <p id="loading" class="loading" hidden><span class="spinner"></span><span id="loading-text">사진을 살펴보는 중...</span></p>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section class="card" id="result-section" hidden>
      <h2>2. 인식된 재료</h2>
      <p class="hint">잘못 인식된 재료는 ×로 지우고, 이름을 눌러 고칠 수 있어요. <span class="badge low">확인 필요</span>는 AI가 확신하지 못한 재료예요.</p>
      <p id="notes" class="notes" hidden></p>
      <div id="ingredient-groups"></div>

      <form id="add-form" class="add-form">
        <input id="add-name" type="text" placeholder="빠진 재료 입력 (예: 두부)" maxlength="30" required>
        <select id="add-category" aria-label="분류"></select>
        <button type="submit">추가</button>
      </form>

      <p id="meta" class="meta"></p>
      <!-- 2단계(레시피 생성) 구현 전까지 숨김 -->
      <button id="recipe-btn" class="primary" hidden>레시피 추천받기</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
